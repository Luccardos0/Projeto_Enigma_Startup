<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma - Boas-vindas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 
                            50: '#f5f3ff', 
                            100: '#ede9fe', 
                            500: '#8b5cf6', 
                            600: '#7c3aed', 
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#341499'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="relative min-h-screen bg-gradient-to-br from-[#4c2ae3] via-[#5a32fa] to-[#2a1385] flex flex-col items-center justify-center p-4 sm:p-8 overflow-hidden font-sans">

    <!-- ARTE DE FUNDO (SVGs Decorativos) -->
    <!-- Peça de Quebra-cabeça Gigante -->
    <svg class="absolute right-[-10%] top-[10%] w-[800px] h-[800px] text-brand-900 opacity-40 pointer-events-none transform rotate-12" viewBox="0 0 100 100" fill="currentColor">
        <path d="M75,25 C75,15 65,15 65,25 L65,30 L45,30 L45,25 C45,15 35,15 35,25 L35,30 L30,30 C20,30 20,40 30,40 L35,40 L35,60 L30,60 C20,60 20,70 30,70 L35,70 L35,75 C35,85 45,85 45,75 L45,70 L65,70 L65,75 C65,85 75,85 75,75 L75,70 L80,70 C90,70 90,60 80,60 L75,60 L75,40 L80,40 C90,40 90,30 80,30 L75,30 Z"/>
    </svg>
    <!-- Brilho (Sparkle) Verde -->
    <svg class="absolute left-[45%] top-[15%] w-12 h-12 text-[#34d399] pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
    </svg>
    <!-- Riscos Decorativos -->
    <svg class="absolute right-[20%] top-[8%] w-12 h-12 text-[#6ee7b7] pointer-events-none transform rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="8"></line>
        <line x1="4" y1="12" x2="10" y2="12"></line>
        <line x1="20" y1="12" x2="14" y2="12"></line>
    </svg>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="z-10 w-full max-w-4xl flex flex-col gap-10">
        
        <!-- Cabeçalho / Logo -->
        <div class="flex flex-col items-center md:items-start text-center md:text-left fade-in-up" style="animation-delay: 0.1s; opacity: 0;">
            <div class="flex items-center gap-2 mb-6">
                <span class="text-4xl font-bold text-white tracking-tight flex items-center">
                    enigma 
                    <svg class="w-6 h-6 text-[#a78bfa] ml-1 mb-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" />
                    </svg>
                </span>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white leading-tight max-w-lg">
                Desvende sua<br>próxima oportunidade.
            </h1>
        </div>

        <!-- Card de Seleção -->
        <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-2xl w-full fade-in-up" style="animation-delay: 0.3s; opacity: 0;">
            <h2 class="text-2xl md:text-3xl font-bold text-center mb-8 text-gray-900">Como você quer entrar?</h2>
            
            <div class="grid md:grid-cols-2 gap-5">
                
                <!-- Botão: Sou Aluno -->
                <a href="aluno.html" class="group flex items-center justify-between p-6 bg-brand-50 border-2 border-transparent rounded-2xl cursor-pointer transition-all duration-300 hover:border-brand-500 hover:shadow-md hover:-translate-y-1">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-brand-600 text-white rounded-xl flex items-center justify-center shadow-inner group-hover:bg-brand-700 transition-colors">
                            <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 mb-1">Sou aluno</h3>
                            <p class="text-sm text-gray-500 leading-snug">Encontre vagas e gere<br>currículos com IA</p>
                        </div>
                    </div>
                    <div class="text-brand-600 opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </div>
                </a>

                <!-- Botão: Sou Empresa -->
                <a href="empresa.html" class="group flex items-center justify-between p-6 bg-brand-50 border-2 border-transparent rounded-2xl cursor-pointer transition-all duration-300 hover:border-brand-500 hover:shadow-md hover:-translate-y-1">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-brand-600 text-white rounded-xl flex items-center justify-center shadow-inner group-hover:bg-brand-700 transition-colors">
                            <i data-lucide="building-2" class="w-7 h-7"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 mb-1">Sou empresa</h3>
                            <p class="text-sm text-gray-500 leading-snug">Publique vagas e<br>encontre talentos</p>
                        </div>
                    </div>
                    <div class="text-brand-600 opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </div>
                </a>

            </div>

            <!-- Footer do Card -->
            <div class="text-center mt-10">
                <a href="#" class="text-brand-700 font-semibold hover:text-brand-900 hover:underline transition-colors text-sm flex items-center justify-center gap-1">
                    Já tenho conta? Entrar
                </a>
            </div>
        </div>

    </div>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();
    </script>
</body>
</html>
